[project]
name = "ai-engineering-knowledgebase"
version = "0.1.0"
description = "Практический курс ML и LLM engineering на небольших моделях"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.3",
  "scikit-learn==1.7.2",
  "torch==2.8.0",
  "transformers==4.56.2",
  "peft==0.17.1",
  "huggingface-hub==0.35.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
